<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>主畫面原型</title>
<!--
  PROTOTYPE（丟棄式原型）— 回答「主畫面長什麼樣」(littlebluewhite/cheer_editor#9)。
  三種版面，同一個檔案，用 ?variant=A|B|C 切換（下面中間的黑條，或鍵盤 ← →）。
  資料只在記憶體裡，重新整理就回到假資料。不放選手真名。
  A 泳道：一人一條時間線。B 動作軌道＋名單：站位要先選才能改。C 八拍表：像紙本八拍表，一行一個八拍。
-->
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;font-size:13px;color:#1d2330;background:#eef0f4;overflow:hidden}
button{font:inherit;cursor:pointer;border:1px solid #c5cad6;background:#fff;border-radius:6px;padding:2px 8px}
button:hover{background:#f3f5fa}
button.primary{background:#2f5bd3;color:#fff;border-color:#2f5bd3}
button.danger{color:#c0392b;border-color:#e3b4ae}
button.link{border:none;background:none;color:#2f5bd3;padding:0;text-decoration:underline}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{font:inherit;border:1px solid #c5cad6;border-radius:5px;padding:2px 5px;background:#fff}
#app{height:100vh;display:grid;min-height:0}
/* header */
.hd{display:flex;gap:10px;align-items:center;padding:6px 10px;background:#1d2330;color:#fff;flex-wrap:wrap}
.hd button{background:#2b3345;color:#fff;border-color:#47506a}
.hd .play{width:40px;font-size:15px}
.hd .time{font-variant-numeric:tabular-nums;min-width:300px}
.hd .warn{color:#ffcf6b}
.hd .knobs{margin-left:auto;border:1px dashed #6b7591;border-radius:6px;padding:2px 8px;color:#aab3c8;font-size:12px}
.hd .knobs input{width:46px}
.hd label{display:flex;gap:4px;align-items:center}
/* field */
.fieldhost{position:relative;min-height:0;min-width:0;background:#dfe3ea;overflow:hidden}
.fieldhost svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none}
.field .margin{fill:#e9ecf1;stroke:#c9ced8;stroke-width:.03;stroke-dasharray:.2 .15}
.field .mat{fill:#3f6fb6;stroke:#1f3f78;stroke-width:.06}
.field .grid{stroke:#ffffff;stroke-opacity:.18;stroke-width:.025}
.field .seam{stroke:#0f2550;stroke-width:.07}
.field .cx{stroke:#fff;stroke-width:.09;fill:none}
.field text{font-family:inherit;text-anchor:middle;pointer-events:none}
.field .num{font-size:.42px;fill:#56607a;font-weight:600}
.field .front{font-size:.5px;fill:#c0392b;font-weight:700}
.field .dot .body{stroke:#fff;stroke-width:.05}
.field .dot .base{fill:#2c3e66}
.field .dot .top{fill:#e0664f}
.field .dot.idle .body{fill:#fff;stroke-width:.08}
.field .dot.idle .base{stroke:#2c3e66}
.field .dot.idle .top{stroke:#e0664f}
.field .dot text{font-size:.3px;fill:#fff;font-weight:700}
.field .dot.idle text{fill:#1d2330}
.field .dot .role{font-size:.24px;fill:#10162a;font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:.08}
.field .dot.fly{filter:drop-shadow(0 .06px .08px rgba(0,0,0,.6))}
.field .dot.fly .body{stroke:#ffe27a;stroke-width:.08}
.field .dot.sel .body{stroke:#ffd400;stroke-width:.12}
.field .dot{cursor:grab}
.field .hl{fill:none;stroke-width:.07;stroke-dasharray:.15 .08}
.field .sp{fill:#ffe9a8}
.field .sp.fine{fill:#7df0c9}
.field .path{stroke:#ffe27a;stroke-width:.04;stroke-dasharray:.12 .1;opacity:.85}
.field .lasso{fill:rgba(255,212,0,.15);stroke:#ffd400;stroke-width:.04}
.ftools{position:absolute;right:8px;top:8px;display:flex;gap:4px;align-items:center;background:rgba(255,255,255,.9);padding:3px 6px;border-radius:8px;font-size:12px}
.fread{position:absolute;left:8px;bottom:8px;background:rgba(29,35,48,.85);color:#fff;padding:3px 8px;border-radius:6px;font-size:12px;pointer-events:none}
.fread:empty{display:none}
.fbanner{position:absolute;left:8px;top:8px;right:220px;background:#fff8dc;border:1px solid #e7d48a;padding:4px 8px;border-radius:6px;font-size:12px}
.flegend{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.9);padding:3px 8px;border-radius:6px;font-size:12px}
/* timeline (A/B) */
.tl{overflow:auto;background:#fff;border-top:2px solid #c5cad6;position:relative;min-height:0}
.tl-in{position:relative}
.row{display:flex;height:16px;border-bottom:1px solid #f0f1f5}
.row .lab{position:sticky;left:0;z-index:3;width:120px;flex:none;background:#fafbfd;border-right:1px solid #dde1ea;padding:0 4px;font-size:11px;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.row .lab button{padding:0 5px;font-size:11px;line-height:14px}
.row .trk{position:relative;flex:none;height:100%}
.row.hd1,.row.hd2,.row.hd3{position:sticky;z-index:4;background:#fff}
.row.hd1{top:0;height:24px}.row.hd2{top:24px;height:20px}.row.hd3{top:44px;height:22px}
.row.hd1 .trk,.row.hd2 .trk,.row.hd3 .trk{background:#fff}
.segb{position:absolute;top:2px;bottom:2px;border-radius:4px;padding:0 6px;font-size:11px;color:#fff;overflow:hidden;white-space:nowrap;cursor:pointer;border:1px solid rgba(0,0,0,.15)}
.segb.music{background:#5167a8}.segb.chant{background:#9a6b2f}
.ruler{cursor:ew-resize}
.tk{position:absolute;bottom:0;width:1px;height:5px;background:#b9bfcc}
.tk.big{height:12px;background:#59627a}
.tk span{position:absolute;left:2px;top:-4px;font-size:10px;color:#3b4358}
.dia{position:absolute;top:2px;transform:translateX(-50%);color:#7a54c7;font-size:15px;line-height:16px;cursor:pointer}
.dia.on{color:#ff8a00;text-shadow:0 0 3px #ffc46b}
.dia.first{color:#3a2a63}
.ph{position:absolute;top:0;bottom:0;width:2px;background:#e8452c;z-index:5;pointer-events:none}
.lane .trk{background:repeating-linear-gradient(90deg,transparent 0 6px,#f6f7fa 6px 7px)}
.lane.sel .lab{background:#fff3b8}
.lane .lab .idl{display:none;color:#9aa1b2;font-style:italic}
.lane .lab.idle-now .idl{display:inline}
.lane .lab.idle-now b{color:#9aa1b2}
.gr{font-style:normal;font-size:10px;border-radius:3px;padding:0 3px;color:#fff}
.gr.base{background:#2c3e66}.gr.top{background:#e0664f}
.bar{position:absolute;top:1px;bottom:1px;border-radius:3px;color:#fff;font-size:10px;line-height:13px;padding:0 4px;overflow:hidden;white-space:nowrap;cursor:grab;opacity:.88}
.bar.on{outline:2px solid #1d2330;opacity:1}
.bar .rz{position:absolute;right:0;top:0;bottom:0;width:6px;cursor:ew-resize;background:rgba(0,0,0,.15)}
/* A */
.va{grid-template-rows:auto minmax(0,1fr) 42vh}
.va-main{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0}
.va-insp{background:#fff;border-left:1px solid #d5d9e2;overflow:auto;padding:10px}
.va-insp h3{margin:4px 0 6px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.muted{color:#7a8296}
/* action form */
.aform label{display:flex;gap:6px;align-items:center;margin:5px 0}
.aform label>input,.aform label>select{flex:1;min-width:0}
.aform textarea{flex:1}
.af-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:4px}
.af-row{display:flex;gap:6px;margin:5px 0}
.af-people{border:1px solid #e3e6ee;border-radius:6px;padding:6px;margin:6px 0}
.af-ph{font-weight:600;margin-bottom:4px;display:flex;justify-content:space-between}
.pp{display:flex;gap:4px;align-items:center;margin:2px 0}
.pp span{width:80px}
.pp select{flex:1}
.pp button{padding:0 5px}
/* B */
.vb{grid-template-rows:auto minmax(0,1fr) 40vh}
.vb-main{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:0}
.vb-roster{background:#fff;border-right:1px solid #d5d9e2;display:flex;flex-direction:column;min-height:0}
.ro-top{padding:6px;border-bottom:1px solid #e3e6ee;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.ro-top .idlec{font-weight:700;color:#b5651d;width:100%}
.ro-list{overflow:auto;flex:1}
.ro{display:flex;gap:5px;align-items:center;padding:2px 6px;border-bottom:1px solid #f2f3f6;cursor:pointer}
.ro.sel{background:#fff3b8}
.ro .st{margin-left:auto;font-size:11px;color:#3b4358;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.ro .st.idle{color:#b5651d;font-style:italic}
.row.film{height:78px}
.th{position:absolute;top:3px;width:84px;height:70px;border:2px solid #cfd3de;border-radius:6px;background:#fff;cursor:pointer;overflow:hidden}
.th.on{border-color:#ff8a00;box-shadow:0 0 0 2px #ffd9a8}
.th svg{width:100%;height:100%}
.th span{position:absolute;left:3px;top:1px;font-size:10px;font-weight:700;background:#fff;border-radius:3px;padding:0 2px}
.th button{position:absolute;right:1px;top:1px;padding:0 4px;font-size:10px;display:none}
.th:hover button{display:block}
.row.alane{height:24px}
.row.alane .bar{line-height:20px;font-size:11px}
.vb-drawer{position:fixed;right:12px;bottom:56px;width:360px;max-height:70vh;overflow:auto;background:#fff;border:1px solid #c5cad6;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:10px;z-index:20}
.copy{margin-top:6px;padding-top:6px;border-top:1px dashed #d5d9e2;display:flex;flex-direction:column;gap:4px}
/* C */
.vc{grid-template-rows:auto minmax(0,1fr) 46vh}
.vc-top{display:grid;grid-template-columns:minmax(0,1fr) 230px;min-height:0}
.vc-forms{background:#fff;border-left:1px solid #d5d9e2;overflow:auto;padding:6px}
.fc{display:grid;grid-template-columns:70px 1fr;gap:2px 6px;border:2px solid #e3e6ee;border-radius:8px;padding:4px;margin-bottom:5px;cursor:pointer;position:relative}
.fc.on{border-color:#ff8a00}
.fc svg{grid-row:span 2;width:70px;height:56px}
.fc button{position:absolute;right:3px;top:3px;padding:0 4px;font-size:10px}
.vc-bot{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr);min-height:0;border-top:2px solid #c5cad6;background:#fff}
.vc-tool{grid-column:1/3;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:5px 8px;background:#f6f7fa;border-bottom:1px solid #dde1ea}
.vc-tool .sep{width:1px;height:18px;background:#cfd3de}
.vc-sheet{overflow:auto;padding:0 6px 40px}
.vc-edit{border-left:1px solid #d5d9e2;overflow:auto;padding:10px}
.sg-h{position:sticky;top:0;z-index:3;background:#e9edf7;padding:4px 6px;font-weight:700;margin-top:6px;display:flex;gap:8px;align-items:center}
.sg-h.chant{background:#f6ecdf}
.srow{display:grid;grid-template-columns:44px minmax(0,1fr) 120px;border-bottom:1px solid #e9ebf1}
.srow .c8{font-weight:700;color:#3b4358;display:flex;align-items:flex-start;justify-content:center;padding-top:3px}
.srow .cells{position:relative;min-height:24px}
.cell{position:absolute;top:0;bottom:0;border-left:1px solid #eef0f5;cursor:pointer}
.cell.beat{border-left-color:#cfd4df}
.cell:hover{background:#f3f6ff}
.cell.dis{background:repeating-linear-gradient(45deg,#f5f5f5 0 4px,#ececec 4px 8px);cursor:default}
.cell i{position:absolute;left:2px;top:1px;font-size:10px;color:#a0a7b8;font-style:normal}
.pc{position:absolute;height:15px;border-radius:3px;color:#fff;font-size:10px;line-height:15px;padding:0 4px;white-space:nowrap;overflow:hidden;cursor:pointer;opacity:.9}
.pc.on{outline:2px solid #1d2330;opacity:1}
.fd{position:absolute;top:0;transform:translateX(-50%);color:#7a54c7;font-size:12px;font-weight:700;pointer-events:none;z-index:2}
.now{position:absolute;top:0;bottom:0;width:2px;background:#e8452c;display:none;pointer-events:none;z-index:2}
.srow .idle{font-size:11px;color:#b5651d;padding:3px 4px}
.addseg{margin:10px 0;display:flex;gap:6px}
/* modal, toast, switcher */
.ov{position:fixed;inset:0;background:rgba(15,20,35,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:#fff;border-radius:10px;min-width:420px;max-width:720px;max-height:86vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid #e3e6ee;position:sticky;top:0;background:#fff}
.mb{padding:12px}
.mb label{display:flex;gap:8px;align-items:center;margin:6px 0}
table.gl{border-collapse:collapse;width:100%}
table.gl td,table.gl th{border:1px solid #e3e6ee;padding:4px 6px;text-align:left;vertical-align:top}
table.gl th{background:#f6f7fa}
.wave{border:1px solid #c5cad6;border-radius:6px;cursor:crosshair;display:block;margin:4px 0}
.impact{background:#fff4f2;border:1px solid #f0c4bb;border-radius:6px;padding:6px;margin-top:8px}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:#1d2330;color:#fff;padding:8px 14px;border-radius:8px;z-index:60;display:none;max-width:70vw}
#switcher{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:#000;color:#fff;border-radius:999px;padding:5px 8px;z-index:40;box-shadow:0 4px 18px rgba(0,0,0,.45);font-size:13px}
#switcher button{background:#222;color:#fff;border-color:#444;border-radius:999px;width:30px}
#switcher .vl{min-width:210px;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="switcher"><button data-sw="-1">◀</button><span class="vl"></span><button data-sw="1">▶</button></div>
<script>
'use strict';
/* ============ 常數 ============ */
const CELL = 1.83, MARGIN = 1;
const FIELDS = { '9直': { cols: 9, rows: 7, orient: '直', label: '9 條直放' }, '5橫': { cols: 7, rows: 5, orient: '橫', label: '5 條橫放' } };
const CATS = [['技巧', '#d9603b'], ['金字塔', '#7d55c7'], ['拋投', '#c28e0e'], ['騰翻', '#2e8b57'], ['跳躍', '#1f84d6'], ['舞蹈', '#d1468c'], ['其他', '#6b7280']];
const catColor = c => (CATS.find(x => x[0] === c) || CATS[6])[1];
// 規則叫法欄：原型暫填，定案前要對過研究筆記
const ROLES = [
  { name: '底層', mean: '在下面撐住別人的人。不分主底、側底時用。', rule: '底層人員' },
  { name: '主底', mean: '主要撐住上層腳的底層。單底層技巧的那位底層。', rule: '底層人員' },
  { name: '側底', mean: '多底層技巧裡，在主底旁邊一起撐的底層。', rule: '底層人員' },
  { name: '上層', mean: '被撐在最上面的人。', rule: '上層人員' },
  { name: '中層', mean: '金字塔裡站在底層身上、又撐住上面的人的人。', rule: '中層人員' },
  { name: '保護', mean: '站在旁邊保護上層，可扶腳踝、小腿、膝蓋，不能撐腳底。', rule: '保護人員' },
  { name: '前保', mean: '站在上層前方的保護。', rule: '保護人員（前方）' },
  { name: '後保', mean: '站在上層背後的人，技巧和籃型拋投都是。', rule: '保護人員／輔助人員（籃拋）' },
  { name: '接者', mean: '接住落下或被拋的上層的人。', rule: '接者' },
  { name: '支撐', mean: '金字塔裡穩住別的上層的人。', rule: '—' },
  { name: '騰翻', mean: '做騰翻的人。', rule: '騰翻' },
];
// 格內切點：四等分平常就吸；八等分放大才出現（使用者在 #9 改的，取代 #8 的 1/3、1/5）
const COARSE = [0, 1 / 4, 1 / 2, 3 / 4, 1], FINE = [1 / 8, 3 / 8, 5 / 8, 7 / 8];
const FRAC_NAMES = [[0, '線上'], [1 / 8, '1/8'], [1 / 4, '1/4'], [3 / 8, '3/8'], [1 / 2, '1/2'], [5 / 8, '5/8'], [3 / 4, '3/4'], [7 / 8, '7/8'], [1, '線上']];

/* ============ 狀態（假資料，不放真名） ============ */
const S = {
  field: '9直', members: [], segs: [], actions: [], forms: [], customRoles: [],
  t: 0, playing: false, sel: new Set(), selAction: null, selForm: null,
  zoom: 1, pan: { x: 0, y: 0 }, fineAt: 2, metro: true,
  rulesOn: true, rules: { chantMin: 30, musicMax: 120, totalMax: 180 },
};
let uid = 100; const nid = p => p + (uid++);
for (let i = 1; i <= 20; i++) S.members.push({ id: i, name: '隊員' + String(i).padStart(2, '0'), gender: i <= 12 ? '男' : '女', role: i <= 14 ? '底層' : '上層' });
S.segs = [
  { id: 's1', type: 'chant', dur: 28 },
  { id: 's2', type: 'music', name: '音樂 1', bpm: 150, firstBeat: 0.4, counts8: 16, lastBeats: 8, buffer: null, fileName: '' },
  { id: 's3', type: 'music', name: '音樂 2', bpm: 140, firstBeat: 0, counts8: 10, lastBeats: 4, buffer: null, fileName: '' },
];
(function seed() {
  const C = CELL, mk = fn => { const o = {}; S.members.forEach(m => o[m.id] = fn(m.id)); return o; };
  const lines = id => { const i = id - 1, r = Math.floor(i / 5), c = i % 5; return [(c - 2) * 2 * C, (r - 1.5) * C]; };
  const groupsAt = (gx, extra) => id => {
    if (id <= 12) { const g = Math.floor((id - 1) / 3), k = (id - 1) % 3, x = gx[g]; return k === 0 ? [x + C / 4, 0] : k === 1 ? [x - C / 4, 0] : [x, -C / 4]; }
    if (id >= 15 && id <= 18) return [gx[id - 15], 0];
    return extra[id];
  };
  const groups = groupsAt([-3 * C, -C, C, 3 * C], { 13: [-4 * C, 2.5 * C], 14: [4 * C, 2.5 * C], 19: [-C, -2.5 * C], 20: [C, -2.5 * C] });
  const pyr = groupsAt([-1.5 * C, -.5 * C, .5 * C, 1.5 * C], { 13: [-2.5 * C, -C / 2], 14: [2.5 * C, -C / 2], 19: [-C / 2, 1.5 * C], 20: [C / 2, 1.5 * C] });
  const wedge = id => { const i = id - 1, r = Math.floor(i / 4), c = i % 4; return [(c - 1.5) * C * (r / 2 + 1), (r - 2) * C]; };
  const fin = id => [(((id - 1) % 10) - 4.5) * C * .8, id <= 10 ? C : -C];
  const F = (seg, at, fn) => S.forms.push({ id: nid('f'), pos: { seg, at }, xy: mk(fn) });
  F('s1', 0, lines); F('s2', 16, groups); F('s2', 56, groups); F('s2', 64, pyr); F('s2', 96, pyr); F('s2', 104, lines); F('s3', 0, wedge); F('s3', 40, fin);
  const grp = (ids, roles) => ids.map((m, i) => ({ m, role: roles[i] || null }));
  const stunt = gs => gs.flatMap(g => grp([1 + 3 * g, 2 + 3 * g, 3 + 3 * g, 15 + g], ['主底', '側底', '後保', '上層']));
  const all = S.members.map(m => ({ m: m.id, role: null }));
  const A = (cat, name, seg, start, len, people) => S.actions.push({ id: nid('a'), cat, name, seg, start, len, people, note: '' });
  A('技巧', '口號延伸', 's1', 10, 8, stunt([0, 1]));
  A('騰翻', '後手翻', 's2', 0, 8, grp([13, 14], ['騰翻', '騰翻']));
  A('舞蹈', '開場舞', 's2', 0, 16, all.filter(p => p.m !== 13 && p.m !== 14).map(p => ({ ...p })));
  A('技巧', 'Lib 組 A', 's2', 24, 32, stunt([0, 1]));
  A('技巧', 'Lib 組 B', 's2', 26, 30, stunt([2, 3]));

}

  },
  segMenu() { const el = h(`<div style="display:flex;gap:8px"><button data-t="music">＋音樂段</button><button data-t="chant">＋口號段</button></div>`); el.onclick = e => { const t = e.target.dataset.t; if (t) { closeModal(); addSeg(t); } }; openModal('在最後加一段', el); },
  renderInsp(root) {
    const ins = $('.va-insp', root), a = S.actions.find(x => x.id === S.selAction), f = S.forms.find(x => x.id === S.selForm);
    ins.innerHTML = `<h3>選人</h3><div class="chips">
      <button data-pick="prev">沿用上一個動作的人</button><button data-pick="all">全隊</button><button data-pick="base">全部底層</button><button data-pick="top">全部上層</button><button data-pick="idle">這一拍沒在動作裡的人</button><button data-pick="none">清除</button></div>
      <div class="muted">場上點人、按住 Shift 多選；或點下面名字。已選 <b>${S.sel.size}</b> 人${S.sel.size ? '：' + [...S.sel].sort((x, y) => x - y).map(i => '#' + i).join(' ') : ''}</div>
      <p><button class="primary" data-new ${S.sel.size ? '' : 'disabled'}>在播放頭新增動作（用已選的人）</button></p><hr>`;
    if (a) ins.append(actionFormEl(a, S.sel.size ? `<button data-x="addsel" style="margin-top:4px">＋把已選的 ${S.sel.size} 人加進來</button>` : ''));
    else if (f) ins.append(h(`<div><h3>站位 ${formIdx(f)}</h3><p>${fmtPos(f.pos)}</p><p class="muted">拖場上的點就是改這張站位。拖上面的 ◆ 可以改時間。</p>${isFirst(f) ? '<p class="muted">開頭那張不能刪。</p>' : '<button class="danger" data-delf>刪掉這張站位</button>'}</div>`));
    else ins.append(h(`<div class="muted"><p>點下面的色條＝選動作（拖可以移、拉右邊可以改長度）。</p><p>灰條紋＝沒動作，就是站著或在走位。名字變灰寫「閒」＝播放頭這一拍沒在動作裡。</p><p>播放頭不在站位上時拖人，會自動在這一拍插一張站位。</p></div>`));
    ins.addEventListener('click', e => {
      const p = e.target.closest('[data-pick]'); if (p) return pick(p.dataset.pick, this);

      if (e.target.closest('[data-delf]')) deleteForm(f);

    r.querySelectorAll('.dia').forEach(d => d.classList.toggle('on', d.dataset.f === S.selForm || formAtT(S.t)?.id === d.dataset.f));
  },
};

      paths: () => !!formAtT(S.t),

      const tz = e.target.closest('[data-tz]'); if (tz) { this.pps = clamp(this.pps * (tz.dataset.tz > 0 ? 1.4 : 1 / 1.4), 4, 80); rerender(); return; }

/* ============ 版面 C：八拍表 ============ */
const VC = {
  key: 'C', label: '八拍表（一行一個八拍）', cand: 0, candT: -1,
  rowHTML(s, r0, span, ncell, valid, label) {
    const cw = span / ncell;
    const pcs = S.actions.filter(a => a.seg === s.id && a.start < r0 + span - 1e-9 && a.start + a.len > r0 + 1e-9).sort((a, b) => a.start - b.start);
    const ends = [], ln = {}; for (const a of pcs) { let i = ends.findIndex(e => e <= a.start + 1e-9); if (i < 0) { i = ends.length; ends.push(0); } ends[i] = a.start + a.len; ln[a.id] = i; }
    const fs = S.forms.filter(f => f.pos.seg === s.id && f.pos.at >= r0 - 1e-9 && f.pos.at < r0 + span - 1e-9);
    const idle = idleAt(posSec({ seg: s.id, at: r0 })).map(m => m.id);
    let cells = '';
    for (let i = 0; i < ncell; i++) { const at = +(r0 + i * cw).toFixed(3), dis = at >= valid - 1e-9; const whole = isMusic(s) ? at % 1 === 0 : at % 1 === 0; cells += `<div class="cell ${dis ? 'dis' : ''} ${whole ? 'beat' : ''}" ${dis ? '' : `data-cs="${s.id}" data-at="${at}"`} style="left:${i / ncell * 100}%;width:${100 / ncell}%">${whole && !dis ? `<i>${isMusic(s) ? (at % 8) + 1 : at + 's'}</i>` : ''}</div>`; }
    const pieces = pcs.map(a => { const from = Math.max(a.start, r0), to = Math.min(a.start + a.len, r0 + span); return `<div class="pc ${S.selAction === a.id ? 'on' : ''}" data-a="${a.id}" style="left:${(from - r0) / span * 100}%;width:calc(${(to - from) / span * 100}% - 2px);top:${16 + ln[a.id] * 17}px;background:${catColor(a.cat)}" title="${esc(aLabel(a))}">${a.start < r0 ? '… ' : ''}${esc(aLabel(a))} <small>${a.people.length}人</small></div>`; }).join('');
    const dias = fs.map(f => `<div class="fd" style="left:${(f.pos.at - r0) / span * 100}%">◆${formIdx(f)}</div>`).join('');
    return `<div class="srow" data-row="${s.id}:${r0}" data-span="${span}"><div class="c8">${label}</div><div class="cells" style="height:${20 + Math.max(ends.length, 1) * 17}px">${cells}${pieces}${dias}<div class="now"></div></div><div class="idle" title="${idle.map(i => '#' + i).join(' ')}">${!idle.length ? '' : idle.length > 6 ? `閒 ${idle.length} 人` : '閒 ' + idle.map(i => '#' + i).join(' ')}</div></div>`;
  },
  sheetHTML() {
    let o = '';
    for (const s of S.segs) {
      o += `<div class="sg-h ${s.type}">${esc(segName(s))}　${isMusic(s) ? `${s.bpm} BPM · 第一拍 ${s.firstBeat.toFixed(2)}s · ${s.counts8} 個八拍` : `${s.dur.toFixed(1)} 秒（只計秒）`} <button data-segset="${s.id}">設定</button></div>`;
      if (isMusic(s)) for (let c = 0; c < s.counts8; c++) o += this.rowHTML(s, c * 8, 8, 16, c === s.counts8 - 1 ? c * 8 + s.lastBeats : c * 8 + 8, c + 1);
      else for (let r0 = 0; r0 < s.dur - 1e-9; r0 += 5) o += this.rowHTML(s, r0, 5, 10, s.dur, `${r0}s`);
    }
    return o + `<div class="addseg"><button data-add="music">＋音樂段</button><button data-add="chant">＋口號段</button></div>`;
  },
  render() {
    const root = freshRoot('vc');
    root.innerHTML = headerHTML() + `<div class="vc-top"><div class="vc-field"></div><aside class="vc-forms"><b>站位</b>${formsSorted().map(({ f }, i) => `<div class="fc" data-fc="${f.id}">${miniField(f.xy)}<b>站位 ${i + 1}</b><span class="muted">${fmtPos(f.pos)}</span>${i ? `<button data-delf="${f.id}">✕</button>` : ''}</div>`).join('')}</aside></div>
      <div class="vc-bot"><div class="vc-tool">
        <b class="cur"></b><span class="sep"></span>
        <button data-act="addform">在這拍插站位</button><button data-act="delform">刪掉這拍的站位</button><span class="sep"></span>
        已選 <b>${S.sel.size}</b> 人 <button data-pick="prev">上一個動作的人</button><button data-pick="all">全隊</button><button data-pick="none">清除</button>
        <button class="primary" data-act="newact" ${S.sel.size ? '' : 'disabled'}>從這拍新增動作</button><span class="muted">在場上拖一個框來選人</span>
      </div><div class="vc-sheet" data-keep="sheet">${this.sheetHTML()}</div><aside class="vc-edit"></aside></div>`;
    bindHeader(root);
    this.field = createField($('.vc-field', root), { autoInsert: true, canEdit: () => true, hollowIdle: true, lasso: true, legend: '空心點＝這一拍沒在動作裡　拖空白處＝框選（按 Alt 拖＝移動畫面）' });
    const ed = $('.vc-edit', root), a = S.actions.find(x => x.id === S.selAction);
    if (a) ed.append(actionFormEl(a, S.sel.size ? `<button data-x="addsel" style="margin-top:4px">＋把已選的 ${S.sel.size} 人加進來</button>` : ''));
    else ed.innerHTML = `<div class="muted"><p>點表上的格子＝把播放頭移到那一拍。</p><p>點色條＝改那個動作。一個動作跨好幾行時，後面幾行開頭有「…」。</p><p>右邊「閒」＝那個八拍第一拍沒在動作裡的人。</p><p>◆＝站位。播放頭不在站位上時拖人，會自動插一張。</p></div>`;
    ed.addEventListener('click', e => { if (e.target.closest('[data-x=addsel]')) tryChange(a, () => S.sel.forEach(m => { if (!a.people.some(p => p.m === m)) a.people.push({ m, role: null }); })); });
    root.addEventListener('click', e => {
      const t = e.target;
      const pc = t.closest('[data-a]'); if (pc && !t.closest('.vc-edit')) { S.selAction = pc.dataset.a; S.selForm = null; rerender(); return; }
      const cell = t.closest('[data-cs]'); if (cell) { seek(posSec({ seg: cell.dataset.cs, at: +cell.dataset.at })); return; }
      const df = t.closest('[data-delf]'); if (df) { deleteForm(S.forms.find(f => f.id === df.dataset.delf)); return; }
      const fc = t.closest('[data-fc]'); if (fc) { S.selForm = fc.dataset.fc; seek(posSec(S.forms.find(f => f.id === fc.dataset.fc).pos)); return; }
      const ss = t.closest('[data-segset]'); if (ss) { openSegDialog(seg(ss.dataset.segset)); return; }
      const ad = t.closest('[data-add]'); if (ad && ad.closest('.addseg')) { addSeg(ad.dataset.add); return; }
      const pk = t.closest('[data-pick]'); if (pk) { pick(pk.dataset.pick, this); return; }
      const act = t.closest('[data-act]')?.dataset.act;
      if (act === 'addform') { insertForm(); rerender(); }
      if (act === 'delform') { const f = formAtT(S.t); if (f) deleteForm(f); }
      if (act === 'newact') newActionFromSel();
    });
    restoreScroll(root); this.root = root; this.tick();
  },
  tick() {
    const r = this.root; if (!r) return;
    tickHeader(r); this.field.draw();
    const p = secPos(S.t, true), s = seg(p.seg), span = isMusic(s) ? 8 : 5, r0 = Math.floor(p.at / span + 1e-9) * span;
    r.querySelectorAll('.now').forEach(n => n.style.display = 'none');
    const row = r.querySelector(`[data-row="${p.seg}:${r0}"]`);
    if (row) { const n = $('.now', row); n.style.display = 'block'; n.style.left = ((S.t - posSec({ seg: p.seg, at: r0 })) / unit(s) / span * 100) + '%'; if (S.playing) row.scrollIntoView({ block: 'nearest' }); }
    const f = formAtT(S.t);
    $('.cur', r).textContent = `播放頭：${fmtPos(p)}${f ? `（站位 ${formIdx(f)}）` : ''}`;
    $('[data-act=delform]', r).disabled = !f || isFirst(f);
    r.querySelectorAll('[data-fc]').forEach(c => c.classList.toggle('on', f?.id === c.dataset.fc));
  },
};

/* ============ 切換器 ============ */
const VARS = [VA, VB, VC];
let V = VARS.find(v => v.key === new URLSearchParams(location.search).get('variant')) || VA;
function rerender() { V.render(); $('#switcher .vl').textContent = `${V.key}（${V.label}）`; }
function switchVar(d) {
  V = VARS[(VARS.indexOf(V) + d + VARS.length) % VARS.length];
  const u = new URL(location.href); u.searchParams.set('variant', V.key); history.replaceState(null, '', u);
  rerender();
}
$('#switcher').addEventListener('click', e => { const d = e.target.dataset.sw; if (d) switchVar(+d); });
addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,select,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') switchVar(-1);
  else if (e.key === 'ArrowRight') switchVar(1);
  else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'Escape') { if ($('.ov')) closeModal(); else { S.sel.clear(); S.selAction = null; S.selForm = null; rerender(); } }
  else if (e.key === 'Delete' || e.key === 'Backspace') {
    const a = S.actions.find(x => x.id === S.selAction), f = S.forms.find(x => x.id === S.selForm);
    if (a) deleteAction(a); else if (f) deleteForm(f);
  }
});
addEventListener('resize', () => V.tick());
rerender();
</script>
</body>
</html>
