# 推上 main 就跑前端和 Rust 伺服器的測試，再建置並部署到 GitHub Pages（https://<owner>.github.io/<repo>/）。
# 伺服器部署到 Fly 是另一個 workflow（fly-deploy.yml）；這個只給舊網址，上線那天拿掉（#269）。
# 第一次使用前要到 GitHub 設定，見 docs/deploy.md。
# 推上 main 建的是一般版（跟新網址一樣）；上線那天手動按 Run workflow、勾「舊網址版」建一份凍住（#267，docs/deploy.md「上線那天」）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      old_site:
        description: 舊網址版（不能登入、首頁黃色搬家條）
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Rust 伺服器（server/）的測試。沒過的話 build 不會跑，也就不會部署。
  server:
    runs-on: ubuntu-latest
    services:
      # #[sqlx::test] 每個測試在這裡開一個新的資料庫。只給 CI 用的帳號，不是金鑰。
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      # build.rs 用 node 打包流程核心（ADR 0013），測試也用 node 比對結果。
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
        working-directory: .
      - run: rustup toolchain install stable --profile minimal
      - run: cargo test --locked

  build:
    needs: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          # 網站放在 /<repo>/ 底下。
          BASE_PATH: /${{ github.event.repository.name }}
          # 舊網址版：OLD_SITE=1（src/lib/old-site.ts）。推 main 時沒有 inputs，是一般版。
          OLD_SITE: ${{ inputs.old_site && '1' || '' }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
