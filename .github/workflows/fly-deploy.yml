# 推上 main 就跑前端和 Rust 伺服器的測試，全過才部署到 Fly（fly.toml、Dockerfile；見 docs/deploy.md）。
# Actions 頁也能手動按 Run workflow（只部署 main）。沒有測試站。
# 只用一把 secret：FLY_API_TOKEN（只能部署這個 app 的 Fly token）。不加 pull_request 的觸發：fork 來的 PR 拿不到它。
name: Deploy to Fly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 一次只部署一個，後來的等前面的跑完（不取消跑到一半的部署）。
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check

  # Rust 伺服器（server/）的測試。
  server:
    runs-on: ubuntu-latest
    services:
      # #[sqlx::test] 每個測試在這裡開一個新的資料庫。只給 CI 用的帳號，不是金鑰。
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      # build.rs 用 node 打包流程核心（ADR 0010），測試也用 node 比對結果。
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
        working-directory: .
      - run: rustup toolchain install stable --profile minimal
      - run: cargo test --locked

  # 在 Fly 的 builder 上建映像檔（前端建好放進伺服器的映像檔），部署前 release_command 跑資料表遷移，
  # 沒跑成就不部署；bluegreen：新機器健康檢查過了才切過去。
  deploy:
    needs: [frontend, server]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1（1.6）
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
