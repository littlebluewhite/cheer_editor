<!doctype html>
<html lang="zh-Hant-TW">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<!-- 分享連結（#share=…）：程式跑起來之前先藏起畫面，不先閃一下首頁（+page.svelte 接手） -->
		<script>
			if (location.hash.startsWith('#share=')) document.documentElement.dataset.openingLink = '';
		</script>
		<!-- 語言（ADR 0017）：照 Paraglide 的順序挑（存的 → 瀏覽器語言 → 中文），先改 lang；
		     不是中文就先藏起畫面，不先閃一下中文（+layout.svelte 接手）。locales 要跟 project.inlang 一樣（有測試） -->
		<script>
			(function () {
				var locales = ['zh-TW', 'en'];
				var pick = function (tag) {
					for (var i = 0; tag && i < locales.length; i++) if (locales[i].toLowerCase() === tag.toLowerCase()) return locales[i];
				};
				var locale;
				try {
					locale = pick(localStorage.getItem('PARAGLIDE_LOCALE'));
				} catch (e) {}
				var langs = navigator.languages || [];
				for (var i = 0; !locale && i < langs.length; i++) {
					locale = pick(langs[i]) || pick(langs[i].split('-')[0]);
					// 哪一種中文（zh-Hant-TW、zh-HK、zh-CN…）都用台灣中文：存起來，Paraglide 先讀存的，兩邊才一樣
					if (!locale && langs[i].split('-')[0].toLowerCase() === 'zh') {
						locale = 'zh-TW';
						try {
							localStorage.setItem('PARAGLIDE_LOCALE', locale);
						} catch (e) {}
					}
				}
				if (locale && locale !== 'zh-TW') {
					document.documentElement.lang = locale;
					document.documentElement.dataset.localePending = '';
				}
			})();
		</script>
		<style>
			html[data-locale-pending] body,
			html[data-opening-link] body {
				visibility: hidden;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
