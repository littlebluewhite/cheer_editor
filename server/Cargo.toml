[package]
name = "cheer-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

# 版號 2026-11-07 從 crates.io 查的（研究筆記〈rust-stack〉第 9 節）。
[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["json", "ws"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dotenvy = "0.15.7"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
resend-rs = { version = "0.35.2", default-features = false, features = ["rustls-tls"] }
rquickjs = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha1 = "0.11"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono"] }
ts-rs = "12.0.1"
unicode-normalization = "0.1.26"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-segmentation = "1.13.3"
governor = { version = "0.10.4", default-features = false, features = ["std", "quanta"] }

[dev-dependencies]
futures-util = "0.3.34"
http-body-util = "0.1.5"
serde_json = { version = "1", features = ["raw_value"] }
tempfile = "3"
tokio-tungstenite = "0.29.0"
tower = { version = "0.5.3", features = ["util"] }

# 測試用 debug 建置，Argon2（故意算很慢）不最佳化的話一次要好幾秒。
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
