[package]
name = "cheer-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

# 版號 2026-11-07 從 crates.io 查的（研究筆記〈rust-stack〉第 9 節）。
[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
dotenvy = "0.15.7"
rquickjs = "0.14.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-segmentation = "1.13.3"

[dev-dependencies]
http-body-util = "0.1.5"
serde_json = { version = "1", features = ["raw_value"] }
tempfile = "3"
tower = { version = "0.5.3", features = ["util"] }
